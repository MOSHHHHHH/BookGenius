name: Trending Book Recommendations

on:
  schedule:
    # 05:00 UTC ≈ 07:00/08:00 Israel time (depending on DST).
    # חשוב: GitHub מפעיל schedule רק אם קובץ ה-workflow נמצא בענף ברירת המחדל.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # הענף שממנו העבודה קוראת ואליו היא דוחפת את השינויים
  TARGET_BRANCH: '3.7.1bup'

jobs:
  update-recommendations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate trending recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # TRENDS_GEO: IL
          # GEMINI_MODEL: gemini-3.5-flash
        run: python scripts/trending_recommendations.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trending-recs.json data/trending-recs-history.json
          git diff --cached --quiet || git commit -m "chore: update trending book recommendations"
          git push origin HEAD:${{ env.TARGET_BRANCH }}
