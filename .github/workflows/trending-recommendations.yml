name: Trending Book Recommendations

on:
  schedule:
    # Retry every two hours; the script skips successful updates younger than 18 hours.
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # The branch the job reads from and pushes to (the GitHub Pages branch).
  # To change it in the future, edit only this line.
  TARGET_BRANCH: '3.8PUB'

concurrency:
  group: bookgenius-trending-recommendations
  cancel-in-progress: false

jobs:
  update-recommendations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate trending recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # TRENDS_GEO: IL                   # default is already IL
          # GEMINI_MODEL: gemini-3.5-flash   # default in the script; override here if needed
        run: python scripts/trending_recommendations.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trending-recs.json data/trending-recs-history.json
          git diff --cached --quiet || git commit -m "chore: update trending book recommendations"
          git push origin HEAD:${{ env.TARGET_BRANCH }}

